# Version updates: a weekly PR per ecosystem with what's new.
# Security updates (enabled in the repo settings) open their own PRs as soon as an advisory lands.
version: 2

updates:
  - package-ecosystem: nuget
    directories:
      - /src/*
      - /tests/*
    schedule:
      interval: weekly
      day: monday
    groups:
      # Aspire and the .NET/EF packages release together, so they move together
      dotnet:
        patterns: ["*"]
        update-types: [minor, patch]
      # Major versions may break things, so they get their own PR, but one for all projects
      # (without this group each major bump opens one PR per project)
      dotnet-major:
        patterns: ["*"]
        update-types: [major]
    open-pull-requests-limit: 5

  # Only patches within the 10.0.1xx feature band: it is the one Ubuntu packages, so the SDK on the development
  # machine (from apt) and CI stay the same and everything still builds locally. Security fixes ship to every band
  - package-ecosystem: dotnet-sdk
    directory: /
    schedule:
      interval: weekly
      day: monday
    ignore:
      - dependency-name: dotnet-sdk
        versions: [">= 10.0.200"]

  - package-ecosystem: pub
    directory: /mobile
    schedule:
      interval: weekly
      day: monday
    groups:
      flutter:
        patterns: ["*"]
        update-types: [minor, patch]
      flutter-major:
        patterns: ["*"]
        update-types: [major]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
