# Version updates: a weekly PR per ecosystem with what's new.
# Security updates (enabled in the repo settings) open their own PRs as soon as an advisory lands.
version: 2

updates:
  - package-ecosystem: nuget
    directories:
      - /src/*
      - /tests/*
      - /tools/*
    schedule:
      interval: weekly
      day: monday
    groups:
      # Aspire and the .NET/EF packages release together, so they move together
      dotnet:
        patterns: ["*"]
        update-types: [minor, patch]
      # Major versions may break things, so they get their own PR, but one for all projects
      # (without this group each major bump opens one PR per project)
      dotnet-major:
        patterns: ["*"]
        update-types: [major]
    open-pull-requests-limit: 5

  - package-ecosystem: dotnet-sdk
    directory: /
    schedule:
      interval: weekly
      day: monday

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
