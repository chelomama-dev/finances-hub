name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Lets the Dependabot lock files workflow run the checks again after its commit:
  # pushes made with GITHUB_TOKEN don't start workflows, but a dispatch does
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      # Locked: the build uses exactly the versions in packages.lock.json. NuGet Audit runs here too, and in CI
      # high and critical advisories fail it (see Directory.Build.props)
      - name: Restore
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # The persistence tests start SQL Server with Testcontainers; the runner has Docker
      - name: Test
        run: dotnet test --no-build --configuration Release --report-xunit-trx --results-directory TestResults

      - name: Test report
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@v3
        with:
          name: Backend tests
          path: TestResults/*.trx
          reporter: dotnet-trx

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Gradle needs a JDK to build the APK; the runner already has the Android SDK
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # The same Flutter as on the development machine
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: Install
        run: flutter pub get --enforce-lockfile

      # json_serializable's *.g.dart files are not committed
      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test

      # Catches Android build problems (Gradle, manifest, resources) on every PR. The release APK comes later
      - name: Build debug APK
        run: flutter build apk --debug --dart-define=DEMO=true
